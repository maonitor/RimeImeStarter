# 用于验证 librime 真实接入的最小拼音方案。
# 生产环境请替换为雾凇拼音 / rime-ice 的完整 schema 与词典。
schema:
  schema_id: luna_pinyin
  name: "最小拼音"
  version: "1.0"
  author:
    - RimeImeStarter
  description: |
    精简拼音方案，词库见 luna_pinyin.dict.yaml。

engine:
  processors:
    - ascii_composer
    - speller
    - selector
    - navigator
    - express_editor
  translators:
    - script_translator
  filters:
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  initials: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"

translator:
  dictionary: luna_pinyin
  preedit_format:
    - "xform/([nl])v/$1ü/"
    - "xform/([nl])ue/$1üe/"
    - "xform/([jqxy])v/$1u/"

menu:
  page_size: 9
  alternative_select_keys: "123456789"
